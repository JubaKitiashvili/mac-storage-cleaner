name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core and shellcheck
        run: brew install bats-core shellcheck

      - name: Run the test suite
        run: bats tests/

      - name: ShellCheck the skill's scripts
        # SC1091: shellcheck cannot follow the runtime-resolved `. "$DIR/lib.sh"` source.
        # SC2034: vars/arrays flagged unused are cross-file globals consumed after lib.sh is sourced.
        # SC2088: tilde inside a quoted case pattern is intentional literal matching, not an expansion bug.
        # SC2227: find's stderr redirect intentionally applies to the whole pipeline, not per-action.
        # SC2254: unquoted case pattern is intentional glob matching for whitelist prefix logic.
        # SC2261: multiple stderr redirections in the find | sort | head pipeline are intentional.
        run: shellcheck -e SC1091,SC2034,SC2088,SC2227,SC2254,SC2261 skills/mac-storage-cleaner/scripts/*.sh
